# One-time setup, before first `docker compose up`:
#   docker network create schloss-net
#   git submodule update --init
# schlussel runs from its own repo (see schlussel/docker-compose.yml) and
# must be on the same network for schloss to reach it by hostname.
#
# Does not publish a host port - reached through the tor gateway (see
# https://github.com/zudaR107/tor), which is the only container that
# binds to a host port.
services:
  schloss:
    build:
      context: .
      args:
        VITE_KUVERT_URL: ${KUVERT_URL:-https://kuvert.localhost}
        VITE_TAFEL_URL: ${TAFEL_URL:-https://tafel.localhost}
        VITE_ZETTEL_URL: ${ZETTEL_URL:-https://zettel.localhost}
        VITE_GLOCKE_URL: ${GLOCKE_URL:-https://glocke.localhost}
        VITE_SCHRANK_URL: ${SCHRANK_URL:-https://schrank.localhost}
        VITE_HEROLD_URL: ${HEROLD_URL:-https://herold.localhost}
        VITE_SCHLUSSEL_URL: ${SCHLUSSEL_WEB_URL:-https://auth.localhost}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    labels:
      hof.wachter.critical: "true"
    networks:
      - schloss-net

networks:
  schloss-net:
    external: true
